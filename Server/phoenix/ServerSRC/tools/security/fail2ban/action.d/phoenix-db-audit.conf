[Definition]

# Firewall ban is handled by the jail's banaction. This action only records
# audit rows and queues optional in-game notices.

actionstart =
actionstop =
actioncheck =

actionban = /usr/local/sbin/phoenix_fail2ban_audit.sh ban "<ip>" "<name>" "<service>" "<reason>" "<bantime>"
actionunban = /usr/local/sbin/phoenix_fail2ban_audit.sh unban "<ip>" "<name>" "<service>" "<reason>" "0"

[Init]
name = phoenix-login-abuse
service = LoginServer
reason = packet_abuse
bantime = 1800
