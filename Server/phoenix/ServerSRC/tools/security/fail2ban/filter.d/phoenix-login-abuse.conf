# Phoenix LoginServer packet abuse guard.
# Matches only protocol-abuse lines emitted by LoginPlayer.cpp into phoenix_packet_abuse.log.
# Normal disconnects and ConnectException lines are intentionally ignored.

failregex = ^.*event=login_invalid_packet_order remote=<HOST> port=\d+ player=NONE status=1 .*
            ^.*event=too_large_packet_id remote=<HOST> port=\d+ player=NONE status=1 .*

ignoreregex =
